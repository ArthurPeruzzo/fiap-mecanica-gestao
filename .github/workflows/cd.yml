# CD — roda a cada push na main. Builda e publica a imagem versionada no ECR e faz o deploy
# no mesmo cluster EKS do monólito (namespace fiap-mecanica). O API Gateway continua no repo
# fiap-mecanica: as rotas /cliente, /veiculo e /gestao para este serviço são adicionadas lá.
name: CD

on:
  push:
    branches: [ "main" ]

concurrency:
  group: cd-${{ github.ref }}
  # false de propósito: kubectl apply cancelado no meio deixa o cluster parcialmente aplicado.
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: eks-fiap-mecanica
  ECR_REPOSITORY: fiap-mecanica-gestao
  RDS_IDENTIFIER: fiap-mecanica-db

jobs:
  build-test:
    uses: ./.github/workflows/build-test.yml

  docker-build-push:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      ecr_repo: ${{ steps.ecr.outputs.repo }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login no ECR
      uses: aws-actions/amazon-ecr-login@v2

    # Provisório: sem módulo Terraform próprio ainda, o repositório ECR é garantido aqui.
    - name: Garantir repositório ECR (idempotente)
      id: ecr
      run: |
        aws ecr describe-repositories --repository-names $ECR_REPOSITORY >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name $ECR_REPOSITORY --image-scanning-configuration scanOnPush=true >/dev/null
        echo "repo=$(aws ecr describe-repositories --repository-names $ECR_REPOSITORY --query 'repositories[0].repositoryUri' --output text)" >> "$GITHUB_OUTPUT"

    - name: Ler versão do pom.xml
      id: get_version
      run: echo "version=$(./mvnw -q -Dexpression=project.version -DforceStdout help:evaluate)" >> "$GITHUB_OUTPUT"

    - name: Impedir sobrescrita de uma tag já publicada
      run: |
        if aws ecr describe-images --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=${{ steps.get_version.outputs.version }} > /dev/null 2>&1; then
          echo "::error::Tag ${{ steps.get_version.outputs.version }} já existe no ECR. Bump a versão em pom.xml antes de dar merge na main."
          exit 1
        fi

    - name: Build e push da imagem
      run: |
        docker build -t ${{ steps.ecr.outputs.repo }}:${{ steps.get_version.outputs.version }} .
        docker push ${{ steps.ecr.outputs.repo }}:${{ steps.get_version.outputs.version }}

  k8s-deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Apontar kubectl para o cluster EKS
      run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Aplicar namespace
      run: kubectl apply -f k8s/namespace.yaml

    - name: Gerar e aplicar Secret (a partir dos GitHub Secrets, sem gravar em disco)
      run: |
        kubectl create secret generic fiap-mecanica-gestao-secret -n fiap-mecanica \
          --from-literal=DB_USERNAME="${{ secrets.TF_VAR_DB_USERNAME }}" \
          --from-literal=DB_PASSWORD="${{ secrets.TF_VAR_DB_PASSWORD }}" \
          --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
          --from-literal=NEW_RELIC_LICENSE_KEY="${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
          --dry-run=client -o yaml | kubectl apply -f -

    # Schema próprio (mecanica_gestao) na instância RDS existente até o serviço ter a sua.
    - name: Gerar ConfigMap
      run: |
        DB_ENDPOINT=$(aws rds describe-db-instances --db-instance-identifier $RDS_IDENTIFIER \
          --query 'DBInstances[0].Endpoint.[Address,Port]' --output text | tr '\t' ':')
        API_URL=$(aws apigatewayv2 get-apis \
          --query "Items[?Name=='fiap-mecanica-api'].ApiEndpoint | [0]" --output text 2>/dev/null || true)
        [ "$API_URL" = "None" ] && API_URL=""
        kubectl create configmap fiap-mecanica-gestao-config -n fiap-mecanica \
          --from-literal=DB_URL="jdbc:mysql://${DB_ENDPOINT}/mecanica_gestao?createDatabaseIfNotExist=true" \
          --from-literal=PUBLIC_BASE_URL="${API_URL}" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Aplicar Service, Deployment e HPA
      run: |
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl set image deployment/fiap-mecanica-gestao \
          fiap-mecanica-gestao=${{ needs.docker-build-push.outputs.ecr_repo }}:${{ needs.docker-build-push.outputs.version }} -n fiap-mecanica
        kubectl apply -f k8s/hpa.yaml

    - name: Aguardar rollout
      run: kubectl rollout status deployment/fiap-mecanica-gestao -n fiap-mecanica --timeout=300s

    - name: Publicar o hostname do ELB no resumo da run
      run: |
        kubectl wait --for=jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
          service/gestao-service -n fiap-mecanica --timeout=180s
        {
          echo "### gestao-service ELB (usar em TF_VAR_gestao_elb_host no API Gateway do fiap-mecanica)"
          echo ""
          echo "\`$(kubectl get svc gestao-service -n fiap-mecanica -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')\`"
        } >> "$GITHUB_STEP_SUMMARY"
