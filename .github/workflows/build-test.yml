name: Build & Test

on:
  workflow_call:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Compile
      run: ./mvnw -B compile
    - name: Run tests
      run: ./mvnw -B test
    - name: Package
      run: ./mvnw -B package -DskipTests
