spring.application.name=mecanica-gestao
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/mecanica_gestao}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true


jwt.secret=${JWT_SECRET}
# Mesmo segredo/issuer do monolito: este servico so valida tokens emitidos por ele ou pela Lambda.
jwt.issuer=mecanica-fiap

# URL publica pela qual a API e acessada de fora (o API Gateway, em producao). Vazio => o springdoc
# deduz do header Host da requisicao, que e o comportamento correto em dev/local/testes.
swagger.server-url=${PUBLIC_BASE_URL:}

# Swagger sob /gestao para nao colidir com o do monolito atras do mesmo API Gateway.
springdoc.swagger-ui.path=/gestao/swagger-ui
springdoc.api-docs.path=/gestao/v3/api-docs

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Logs estruturados em JSON (Spring Boot structured logging, sem dependencia extra).
# Formato ECS inclui trace.id/span.id automaticamente quando ha um trace ativo,
# correlacionando os logs com as traces exportadas via OTLP abaixo.
logging.structured.format.console=ecs

# Observabilidade: traces + metricas exportados via OTLP para a New Relic.
# api-key vem de NEW_RELIC_LICENSE_KEY (env var / k8s Secret), nunca hardcoded.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:https://otlp.nr-data.net:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.headers.api-key=${NEW_RELIC_LICENSE_KEY:}
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:https://otlp.nr-data.net:4318/v1/metrics}
management.otlp.metrics.export.headers.api-key=${NEW_RELIC_LICENSE_KEY:}
# A New Relic e um sistema delta: com o default (cumulative) os Timers viram
# histogramas cumulativos re-emitidos a cada step, e average()/count() no NRQL
# ficam sem sentido (mostram o total acumulado, nao a media da janela).
management.otlp.metrics.export.aggregation-temporality=delta
management.otlp.metrics.export.histogram-flavor=base2-exponential-bucket-histogram
# Step menor => o dado da fase aparece no dashboard em ~30s em vez de ate 1min.
management.otlp.metrics.export.step=30s